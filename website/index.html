<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <title>Clastor — Run your tutoring business without the admin headache</title>
    <meta
      name="description"
      content="Clastor is the all-in-one platform for tutors. Manage students, lessons, scheduling, invoices, and payments in one calm, organized workspace — so you can spend more time teaching."
    />
    <meta name="author" content="Clastor" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clastor — Tutor management, handled" />
    <meta
      property="og:description"
      content="Schedule lessons, send reminders, and get paid — all connected, all automatic. Run your tutoring business from one place."
    />
    <meta property="og:site_name" content="Clastor" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clastor — Tutor management, handled" />
    <meta
      name="twitter:description"
      content="Manage students, lessons, scheduling, invoices, and payments in one calm, organized workspace."
    />

    <!-- Fonts: Inter, preconnect + swap for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
