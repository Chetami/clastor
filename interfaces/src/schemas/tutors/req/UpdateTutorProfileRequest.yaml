type: object
required:
  - slug
properties:
  slug:
    type: string
    description: >-
      URL-safe slug for the public URL. Lowercase letters, digits and
      hyphens only, 3-40 characters, unique across all profiles.
    example: jane-math
  headline:
    type: string
    nullable: true
    description: Short one-line tagline shown beneath the tutor's name
    example: Certified Math Tutor for Grades 6-12
  bio:
    type: string
    nullable: true
    description: Longer free-form about paragraph
  subjectIds:
    type: array
    items:
      type: string
    description: >-
      Ids from the tutor's subject catalogue (users.subjects) to showcase on
      the public page. Names and colors are resolved from the catalogue at
      read time so the page always matches Settings.
    example: [subj_abc123, subj_def456]
  qualifications:
    type: array
    items:
      type: string
    description: Degrees, certifications or experience notes
    example: [BSc Mathematics, 8+ years tutoring]
  hourlyRate:
    type: number
    format: double
    nullable: true
    minimum: 0
    description: Optional hourly rate displayed on the public page
    example: 45
  location:
    type: string
    nullable: true
    maxLength: 80
    description: Where the tutor teaches in person (suburb, city or region)
    example: Sydney, NSW
  teachesOnline:
    type: boolean
    description: Whether the tutor offers online lessons
    example: true
  yearsExperience:
    type: integer
    nullable: true
    minimum: 0
    maximum: 60
    description: Years of tutoring experience, shown on the public page
    example: 8
  contactEmail:
    type: string
    format: email
    nullable: true
    description: Email used by the public page's contact CTA. Null hides the CTA.
    example: jane@example.com
  ctaText:
    type: string
    nullable: true
    description: Custom label for the contact button. Falls back to a default.
    example: Get in touch
description: |-
  Request body for creating or updating the authenticated tutor's profile
  id, tutorId, status and timestamps are managed server-side
