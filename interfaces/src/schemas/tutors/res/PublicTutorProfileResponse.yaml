type: object
required:
  - slug
  - subjects
  - qualifications
  - name
  - teachesOnline
  - reviewCount
properties:
  slug:
    type: string
    description: The profile's URL slug
    example: jane-math
  headline:
    type: string
    nullable: true
  bio:
    type: string
    nullable: true
  subjects:
    type: array
    description: >-
      Showcase subjects resolved from the tutor's subject catalogue, with
      each subject's color for chips.
    items:
      $ref: '../../common/Subject.yaml'
  qualifications:
    type: array
    items:
      type: string
  hourlyRate:
    type: number
    format: double
    nullable: true
  currency:
    type: string
  location:
    type: string
    nullable: true
    description: Where the tutor teaches in person
    example: Sydney, NSW
  teachesOnline:
    type: boolean
    description: Whether the tutor offers online lessons
  yearsExperience:
    type: integer
    nullable: true
    description: Years of tutoring experience
    example: 8
  contactEmail:
    type: string
    format: email
    nullable: true
  ctaText:
    type: string
    nullable: true
  availability:
    type: array
    description: >-
      Weekly availability derived from the tutor's working hours. Empty when
      not configured.
    items:
      $ref: './AvailabilitySlot.yaml'
  ratingAvg:
    type: number
    format: double
    nullable: true
    description: Average rating (1-5) across approved reviews, null when none
    example: 4.8
  reviewCount:
    type: integer
    description: Number of approved reviews
    example: 12
  name:
    type: string
    description: Tutor's display name (from their user record)
    example: Jane Doe
  avatarUrl:
    type: string
    nullable: true
    description: Tutor's profile picture (data URL or remote URL from their user record)
description: |-
  Public tutor profile response
  Safe to serve to unauthenticated visitors; contains no internal fields or status
