type: object
required:
  - id
  - tutorId
  - slug
  - status
  - subjects
  - qualifications
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    description: Profile document ID (equals the tutor's Firebase Auth UID)
  tutorId:
    type: string
    description: ID of the tutor who owns this profile
  slug:
    type: string
    description: URL-safe slug used in the public URL (/t/:slug)
    example: jane-math
  status:
    $ref: '../TutorProfileStatus.yaml'
  headline:
    type: string
    nullable: true
  bio:
    type: string
    nullable: true
  subjects:
    type: array
    description: >-
      Showcase subjects resolved from the tutor's catalogue (subjectIds),
      including each subject's color.
    items:
      $ref: '../../common/Subject.yaml'
  qualifications:
    type: array
    items:
      type: string
  hourlyRate:
    type: number
    format: double
    nullable: true
  currency:
    type: string
  location:
    type: string
    nullable: true
  teachesOnline:
    type: boolean
  yearsExperience:
    type: integer
    nullable: true
  contactEmail:
    type: string
    format: email
    nullable: true
  ctaText:
    type: string
    nullable: true
  availability:
    type: array
    description: >-
      Weekly availability derived from the tutor's working hours. Empty when
      not configured.
    items:
      $ref: './AvailabilitySlot.yaml'
  ratingAvg:
    type: number
    format: double
    nullable: true
    description: Average rating (1-5) across approved reviews, null when none
  reviewCount:
    type: integer
    description: Number of approved reviews
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
  publishedAt:
    type: string
    format: date-time
    nullable: true
description: |-
  Owner-facing tutor profile response
  Returned to the authenticated tutor managing their own profile
