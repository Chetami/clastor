type: object
required:
  - id
  - tutorId
  - authorName
  - rating
  - status
  - createdAt
properties:
  id:
    type: string
    description: Review document ID
  tutorId:
    type: string
    description: ID of the tutor the review is about
  authorName:
    type: string
    description: Display name of the reviewer
    example: Sarah M.
  rating:
    type: integer
    minimum: 1
    maximum: 5
    description: Star rating from 1 to 5
    example: 5
  comment:
    type: string
    nullable: true
    description: Optional written feedback
  status:
    $ref: '../TutorReviewStatus.yaml'
  createdAt:
    type: string
    format: date-time
    description: When the review was submitted
  moderatedAt:
    type: string
    format: date-time
    nullable: true
    description: When the review was last approved or rejected. Null while pending.
description: Owner-facing tutor review, including moderation status.
