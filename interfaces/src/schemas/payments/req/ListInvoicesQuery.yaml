type: object
properties:
  status:
    $ref: '../InvoiceStatus.yaml'
    description: >-
      Filter by status. Note "overdue" is derived, so filtering by it
      returns open invoices past their dueDate. Filtering by "open"
      includes both open and overdue invoices.
  search:
    type: string
    description: >-
      Free-text search across invoiceNumber and customerName. When present,
      the response falls back to an unpaginated full-fetch (in-memory
      filter) regardless of limit/cursor.
    example: Alice
  sort:
    type: string
    enum:
      - invoiceNumber
      - total
      - customerName
      - dueDate
      - issueDate
      - createdAt
    default: createdAt
    description: Sort field for the invoice list (unpaginated mode only)
  order:
    type: string
    enum:
      - asc
      - desc
    default: desc
    description: Sort direction (unpaginated mode only)
  limit:
    type: integer
    minimum: 1
    maximum: 100
    description: >-
      Page size for cursor pagination. Omit for an unpaginated full fetch
      (used by dashboards and mobile). Ignored when `search` is present.
    example: 10
  cursor:
    type: string
    description: >-
      Opaque pagination cursor returned in the previous response's
      `nextCursor`. Omit on the first page.
description: Query parameters for listing invoices
