type: object
required:
  - id
  - invoiceNumber
  - tutorId
  - studentId
  - customerName
  - billingEmail
  - status
  - currency
  - lineItems
  - subtotal
  - total
  - paymentMethod
  - issueDate
  - dueDate
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    description: Unique invoice identifier
    example: inv_a1b2c3d4e5f6
  invoiceNumber:
    type: string
    description: >-
      Human-readable, sequential per-tutor number (e.g. INV-0001).
      Auto-generated server-side on creation.
    example: INV-0001
  tutorId:
    type: string
    description: ID of the tutor who owns this invoice
    example: tutor_abc123
  studentId:
    type: string
    description: ID of the student this invoice is for
    example: student_123
  customerName:
    type: string
    description: Snapshot of the student's name at creation time
    example: Alice Johnson
  billingEmail:
    type: string
    format: email
    nullable: true
    description: >-
      Snapshot of the resolved billing email at creation time. May be null
      when the student has no email, parent email, or explicit override.
    example: parent.johnson@example.com
  status:
    $ref: './InvoiceStatus.yaml'
  currency:
    type: string
    description: ISO 4217 currency code. Currently always AUD.
    example: AUD
  lineItems:
    type: array
    items:
      $ref: './InvoiceLineItem.yaml'
    description: Chargeable lines (one per chosen lesson)
  subtotal:
    type: number
    format: double
    minimum: 0
    description: Sum of all line item amounts
    example: 135
  total:
    type: number
    format: double
    minimum: 0
    description: Final amount due (subtotal; tax not modelled today)
    example: 135
  paymentMethod:
    $ref: './PaymentMethod.yaml'
  issueDate:
    type: string
    format: date-time
    description: When the invoice was issued (defaults to creation date)
  dueDate:
    type: string
    format: date-time
    description: Payment due date
  paidAt:
    type: string
    format: date-time
    nullable: true
    description: Timestamp payment was recorded, or null if not yet paid
  sentAt:
    type: string
    format: date-time
    nullable: true
    description: >-
      Timestamp the invoice was last emailed to the billing contact, or null
      if it has never been sent.
  notes:
    type: string
    nullable: true
    description: Optional free-form notes shown on the invoice
  stripePaymentIntentId:
    type: string
    nullable: true
    description: >-
      The Stripe PaymentIntent id when the invoice was paid via Stripe online
      checkout, for reconciliation. Null otherwise.
  createdAt:
    type: string
    format: date-time
    description: When the invoice record was created
  updatedAt:
    type: string
    format: date-time
    description: When the invoice record was last updated
description: |-
  Invoice interface
  Represents an invoice in the Firestore invoices collection. Each invoice
  is built from one or more unpaid lessons for a single student.
