type: object
required:
  - data
  - nextCursor
  - hasMore
properties:
  data:
    type: array
    items:
      $ref: './InvoiceResponse.yaml'
    description: >-
      Invoices for the current page (paginated mode) or every matching
      invoice (unpaginated mode, when the request omitted `limit`).
  total:
    type: integer
    minimum: 0
    description: >-
      Total count of matching invoices. Only present in unpaginated mode.
  nextCursor:
    type: string
    nullable: true
    description: >-
      Opaque cursor for the next page. Pass it back as the `cursor` query
      parameter to fetch the next page. `null` when there are no more pages
      (or in unpaginated mode).
  hasMore:
    type: boolean
    description: >-
      `true` when another page is available (equivalent to `nextCursor`
      being non-null).
description: |-
  List response for invoices. Cursor-paginated when the request supplied a
  `limit`; otherwise the full matching set with `nextCursor` null.
