type: string
enum:
  - cash
  - bank_transfer
  - stripe
description: |-
  Recorded payment method for an invoice. Purely descriptive — no money
  movement happens in-app. Captures how the tutor expects to be (or was)
  paid for this invoice.
  - cash: physical cash
  - bank_transfer: direct deposit / EFT
  - stripe: Stripe payment link (recorded only; no live integration)
