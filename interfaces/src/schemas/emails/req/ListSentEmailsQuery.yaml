type: object
required:
  - type
  - to
  - subject
  - status
  - bodyHtml
  - tutorId
  - sentBy
description: |-
  Query parameters for GET /api/sent-emails. Exactly one scoping filter is
  expected (lessonId / invoiceId / studentId); when none is supplied only
  system_admin users receive an unscoped list.
properties:
  lessonId:
    type: string
    description: Scope to emails sent for a specific lesson
  invoiceId:
    type: string
    description: Scope to emails sent for a specific invoice
  studentId:
    type: string
    description: Scope to emails sent for / about a specific student
