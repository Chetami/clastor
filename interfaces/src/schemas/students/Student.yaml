type: object
required:
  - id
  - name
  - email
  - subjectIds
  - expectedAmount
  - rateType
  - frequencyPerWeek
  - status
  - amountOwed
  - billingEmail
  - tutorId
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    description: Unique student identifier
    example: stu_123
  tutorId:
    type: string
    description: >-
      Legacy single-tutor field. Kept for backward compatibility with existing
      writes and personal-mode (non-org) students. For organisation students,
      prefer `tutorIds`. The read layer falls back to this when `tutorIds`
      is absent.
    example: tutor_abc123
  organisationId:
    type: string
    nullable: true
    description: >-
      ID of the organisation this student belongs to, or null for a legacy /
      personal-mode student (visible only to its tutor in personal mode).
    example: org_abc123
  tutorIds:
    type: array
    description: >-
      Tutors assigned to this organisation student (organisation students can
      be taught by multiple tutors). Absent for legacy personal students,
      which use the single `tutorId` field instead; readers should treat
      absent as an empty array.
    items:
      type: string
    example:
      - tutor_abc123
      - tutor_def456
  name:
    type: string
    description: Student's full name
    example: Alice Johnson
  email:
    type: string
    format: email
    description: Student's email address
    example: alice.johnson@example.com
  phone:
    type: string
    nullable: true
    description: Optional contact phone number
    example: "+1 555 0100"
  parentEmail:
    type: string
    format: email
    nullable: true
    description: >-
      Linked parent/guardian email. Temporary field until a dedicated
      parent object relationship is introduced.
    example: parent.johnson@example.com
  billingEmail:
    type: string
    format: email
    description: >-
      Email address used as the default recipient when creating invoices
      for this student. Always non-null: resolved at read time as the
      tutor's explicit override (if set), otherwise the parentEmail,
      otherwise the student's own email.
    example: billing.johnson@example.com
  subjectIds:
    type: array
    description: >-
      Ids of the subjects (from the tutor's catalogue on their user document)
      the student is being tutored in.
    items:
      type: string
    default: []
    example:
      - subj_abc123
  expectedAmount:
    type: number
    format: double
    minimum: 0
    description: Expected charge amount
    example: 45
  rateType:
    $ref: './RateType.yaml'
  frequencyPerWeek:
    type: integer
    minimum: 0
    description: >-
      How often the student is seen per week. Interpreted as hours per
      week when rateType is hourly, or lessons per week when per_lesson.
    example: 4
  status:
    $ref: './StudentStatus.yaml'
  timezone:
    type: string
    nullable: true
    description: >-
      IANA timezone identifier (e.g. America/New_York). Nullable; null
      means no timezone is specified (checkbox unchecked in the UI).
    example: America/New_York
  notes:
    type: string
    nullable: true
    description: Free-form notes about the student
  amountOwed:
    type: number
    format: double
    minimum: 0
    deprecated: true
    description: >-
      Deprecated: Outstanding balance the student currently owes. Use the
      /api/payments/student/:studentId/debt endpoint instead to calculate
      debt from open and overdue invoices.
    example: 90
  createdAt:
    type: string
    format: date-time
    description: When the student record was created
  updatedAt:
    type: string
    format: date-time
    description: When the student record was last updated
description: |-
  Student interface
  Represents a student in the Firestore students collection
