type: object
required:
  - id
  - name
  - email
  - subjectIds
  - expectedAmount
  - rateType
  - frequencyPerWeek
  - status
  - amountOwed
  - billingEmail
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    description: Unique student identifier
    example: stu_123
  name:
    type: string
    description: Student's full name
    example: Alice Johnson
  email:
    type: string
    format: email
    description: Student's email address
    example: alice.johnson@example.com
  phone:
    type: string
    nullable: true
    description: Optional contact phone number
    example: "+1 555 0100"
  parentEmail:
    type: string
    format: email
    nullable: true
    description: >-
      Linked parent/guardian email. Temporary field until a dedicated
      parent object relationship is introduced.
    example: parent.johnson@example.com
  billingEmail:
    type: string
    format: email
    description: >-
      Email used as the default recipient when creating invoices for this
      student. Always non-null: resolved at read time as the tutor's
      explicit override (if set), otherwise parentEmail, otherwise the
      student's own email.
    example: billing.johnson@example.com
  subjectIds:
    type: array
    description: >-
      Ids of the subjects (from the tutor's catalogue on their user document)
      the student is being tutored in. Resolve to names/colors client-side.
    items:
      type: string
    default: []
    example:
      - subj_abc123
  expectedAmount:
    type: number
    format: double
    minimum: 0
    description: Expected charge amount
    example: 45
  rateType:
    $ref: '../RateType.yaml'
  frequencyPerWeek:
    type: integer
    minimum: 0
    description: >-
      How often the student is seen per week. Interpreted as hours per
      week when rateType is hourly, or lessons per week when per_lesson.
    example: 4
  status:
    $ref: '../StudentStatus.yaml'
  timezone:
    type: string
    nullable: true
    description: >-
      IANA timezone identifier (e.g. America/New_York). Nullable; null
      means no timezone is specified (checkbox unchecked in the UI).
    example: America/New_York
  notes:
    type: string
    nullable: true
    description: Free-form notes about the student
  amountOwed:
    type: number
    format: double
    minimum: 0
    description: >-
      Outstanding balance the student currently owes. Billing is managed
      separately; this is a denormalized display field.
    example: 90
  createdAt:
    type: string
    format: date-time
    description: When the student record was created
  updatedAt:
    type: string
    format: date-time
    description: When the student record was last updated
  tutorName:
    type: string
    nullable: true
    description: >-
      Display name of the owning tutor. Populated only on admin (system-wide)
      list responses; null otherwise.
  tutorEmail:
    type: string
    nullable: true
    description: Email of the owning tutor. Populated only on admin list responses.
description: |-
  Student response object
  Represents a student in the Firestore students collection as returned by the API
