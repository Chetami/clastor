type: object
properties:
  limit:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
    description: Maximum number of students to return
    example: 20
  offset:
    type: integer
    minimum: 0
    default: 0
    description: Number of students to skip (for pagination)
    example: 0
  status:
    $ref: '../StudentStatus.yaml'
    description: Filter by student status
  search:
    type: string
    description: Search query to filter by name or email
    example: johnson
  subjectId:
    type: string
    description: Filter to students tagged with this subject id
    example: subj_abc123
description: |-
  Query parameters for listing students
  All parameters are optional and used for filtering and pagination
