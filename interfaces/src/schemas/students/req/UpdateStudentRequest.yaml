type: object
properties:
  name:
    type: string
    description: Student's full name
    example: Alice Johnson
  email:
    type: string
    format: email
    nullable: true
    description: >-
      Student's email address (optional). Send null to clear an existing
      email.
    example: alice.johnson@example.com
  phone:
    type: string
    nullable: true
    description: Optional contact phone number
    example: "+1 555 0100"
  parentEmail:
    type: string
    format: email
    nullable: true
    description: >-
      Linked parent/guardian email. Temporary field until a dedicated
      parent object relationship is introduced.
    example: parent.johnson@example.com
  billingEmail:
    type: string
    format: email
    nullable: true
    description: >-
      Email used as the default recipient when creating invoices for this
      student. Send null (or omit) to clear the override and let the
      backend derive the billing email automatically (parentEmail first,
      then the student's own email). Send a non-null value to set an
      explicit override.
    example: billing.johnson@example.com
  subjectIds:
    type: array
    description: >-
      Ids of the subjects (from the tutor's catalogue) the student is being
      tutored in. Replaces the existing set when provided.
    items:
      type: string
  expectedAmount:
    type: number
    format: double
    minimum: 0
    description: Expected charge amount
    example: 45
  rateType:
    $ref: '../RateType.yaml'
  frequencyPerWeek:
    type: integer
    minimum: 0
    description: >-
      How often the student is seen per week. Interpreted as hours per
      week when rateType is hourly, or lessons per week when per_lesson.
    example: 4
  status:
    $ref: '../StudentStatus.yaml'
  timezone:
    type: string
    nullable: true
    description: >-
      IANA timezone identifier (e.g. America/New_York). Nullable; null
      means no timezone is specified (checkbox unchecked in the UI).
    example: America/New_York
  notes:
    type: string
    nullable: true
    description: Free-form notes about the student
description: |-
  Request body for updating a student
  All fields are optional; only provided fields will be updated
