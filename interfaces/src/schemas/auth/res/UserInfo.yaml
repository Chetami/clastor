type: object
required:
  - uid
  - email
  - role
  - onboardingComplete
  - tourSeen
  - reminderLeadTime
properties:
  uid:
    type: string
    description: Firebase Auth UID
    example: abc123xyz456
  name:
    type: string
    description: User's display name
    example: John Doe
  email:
    type: string
    format: email
    description: User's email address
    example: admin@example.com
  role:
    $ref: '../../common/Role.yaml'
  currentOrgId:
    type: string
    nullable: true
    description: >-
      ID of the organisation the user is currently operating in, or null for
      personal mode. Present so the client knows which scope to render
      without an extra fetch.
    example: org_abc123
  currentOrgRole:
    nullable: true
    allOf:
      - $ref: '../../organisations/OrgMemberRole.yaml'
    description: >-
      The user's per-membership role in currentOrgId (org_admin | member), or
      null when in personal mode. Lets the client gate org-admin UI without a
      round-trip.
  avatarUrl:
    type: string
    nullable: true
    description: Optional profile picture URL
    example: https://example.com/avatar.jpg
  currency:
    type: string
    description: ISO 4217 currency code the tutor charges in
    default: AUD
    example: AUD
  reminderLeadTime:
    $ref: '../../common/ReminderLeadTime.yaml'
  workingHours:
    nullable: true
    allOf:
      - $ref: '../../users/WorkingHours.yaml'
    description: >-
      The tutor's weekly working hours (per-day windows or null for a day
      off). Null overall means not configured. Shown as bands on the Schedule
      and used for the out-of-hours booking warning.
  subjects:
    type: array
    description: >-
      Subjects this tutor teaches (their catalogue). Present in the auth
      response so the client can resolve student `subjectIds` to names/colors
      without an extra fetch.
    items:
      $ref: '../../common/Subject.yaml'
    default: []
  onboardingComplete:
    type: boolean
    default: false
    description: Whether the user has finished or dismissed the onboarding flow
  tourSeen:
    type: boolean
    default: false
    description: Whether the user has seen (or skipped) the in-app product tour
description: |-
  User info response object
  Basic user information returned by authentication endpoints
  Used in LoginResponse, RegisterResponse, and VerifyTokenResponse
