type: object
required:
  - uid
  - email
  - role
  - onboardingComplete
  - tourSeen
  - reminderLeadTime
properties:
  uid:
    type: string
    description: Firebase Auth UID
    example: abc123xyz456
  name:
    type: string
    description: User's display name
    example: John Doe
  email:
    type: string
    format: email
    description: User's email address
    example: admin@example.com
  role:
    $ref: '../../common/Role.yaml'
  emailVerified:
    type: boolean
    description: >-
      Whether the user's email address is verified in Firebase Auth. Absent on
      responses from older deployments. Google sign-in accounts are always
      verified. Unverified users can sign in but are blocked from actions that
      reach other people (emails to students, invoices, calendar writes).
    example: true
  avatarUrl:
    type: string
    nullable: true
    description: Optional profile picture URL
    example: https://example.com/avatar.jpg
  currency:
    type: string
    description: ISO 4217 currency code the tutor charges in
    default: AUD
    example: AUD
  timezone:
    type: string
    nullable: true
    description: >-
      IANA timezone identifier the tutor's wall-clock times are rendered in
      (e.g. Australia/Sydney). Present in the auth response so the client can
      detect drift from the browser timezone and sync it. Null means not set
      yet (legacy docs); the client should push a detected value.
    example: Australia/Sydney
  reminderLeadTime:
    $ref: '../../common/ReminderLeadTime.yaml'
  workingHours:
    nullable: true
    allOf:
      - $ref: '../../users/WorkingHours.yaml'
    description: >-
      The tutor's weekly working hours (per-day windows or null for a day
      off). Null overall means not configured. Shown as bands on the Schedule
      and used for the out-of-hours booking warning.
  subjects:
    type: array
    description: >-
      Subjects this tutor teaches (their catalogue). Present in the auth
      response so the client can resolve student `subjectIds` to names/colors
      without an extra fetch.
    items:
      $ref: '../../common/Subject.yaml'
    default: []
  onboardingComplete:
    type: boolean
    default: false
    description: Whether the user has finished or dismissed the onboarding flow
  googleConnected:
    type: boolean
    default: false
    description: >-
      Whether the tutor has connected a Google account (Calendar / Meet) via
      the OAuth consent flow. Derived server-side from the stored connection;
      lets clients skip connect prompts (e.g. the onboarding calendar step)
      without a separate status fetch.
  tourSeen:
    type: boolean
    default: false
    description: Whether the user has seen (or skipped) the in-app product tour
  invoiceSettings:
    allOf:
      - $ref: '../../users/InvoiceSettings.yaml'
    description: >-
      Invoice customisation preferences (ABN + bank details) printed on this
      tutor's invoices. Null means no extra details are shown.
  emailReviewSettings:
    allOf:
      - $ref: '../../users/EmailReviewSettings.yaml'
    description: >-
      Controls whether outbound emails are reviewed before sending. Null means
      review is enabled (the default).
  signupSurvey:
    allOf:
      - $ref: '../../users/SignupSurvey.yaml'
    description: >-
      Optional pre-signup qualifier survey captured on the landing flow.
      Present in the auth response so the client can personalise onboarding.
      Null when the user skipped the survey or signed up before it existed.
description: |-
  User info response object
  Basic user information returned by authentication endpoints
  Used in LoginResponse, RegisterResponse, and VerifyTokenResponse
