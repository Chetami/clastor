type: object
required:
  - jwtToken
  - refreshToken
  - user
properties:
  jwtToken:
    type: string
    description: New short-lived custom JWT access token (expires in 15 minutes)
    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  refreshToken:
    type: string
    description: New rotated long-lived refresh token (supersedes the presented one)
    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  user:
    $ref: './UserInfo.yaml'
description: |-
  Refresh response body
  Returned from backend /api/auth/refresh endpoint.
  The presented refresh token is revoked and replaced by a fresh rotating pair.
