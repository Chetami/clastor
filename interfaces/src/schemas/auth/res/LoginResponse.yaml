type: object
required:
  - jwtToken
  - refreshToken
  - user
properties:
  jwtToken:
    type: string
    description: Short-lived custom JWT access token (expires in 15 minutes)
    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  refreshToken:
    type: string
    description: Long-lived opaque refresh token (expires in 30 days), rotated on each refresh
    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  user:
    $ref: './UserInfo.yaml'
  isNewUser:
    type: boolean
    description: >-
      True when this exchange created the user's Firestore document (first-ever
      sign-in). Only set by the Google auth endpoint; clients use it to run
      first-time flows (e.g. the calendar consent prompt) right after signup.
description: |-
  Login response body
  Returned from backend /api/auth/login endpoint
  Contains access token, refresh token, and user information
