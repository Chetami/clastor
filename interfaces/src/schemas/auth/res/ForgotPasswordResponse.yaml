type: object
required:
  - message
properties:
  message:
    type: string
    description: Generic confirmation that the request was processed (identical whether or not the account exists).
    example: If an account exists for that email, a reset link has been sent.
description: |-
  Forgot-password response body
  Returned from POST /api/auth/forgot-password. Deliberately uninformative
  to prevent account enumeration.
