type: object
required:
  - jwtToken
  - user
properties:
  jwtToken:
    type: string
    description: Custom JWT token (expires in 1 hour)
    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
  user:
    $ref: './UserInfo.yaml'
description: |-
  Register response body
  Returned from backend /api/auth/register endpoint
  Contains JWT token and user information
