type: object
required:
  - firebaseToken
properties:
  firebaseToken:
    type: string
    description: Firebase ID token from client authentication
    example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
description: |-
  Login request body
  The Firebase token can also be sent in Authorization header instead
  Sent from frontend to backend /api/auth/login endpoint
