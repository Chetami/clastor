type: object
required:
  - email
properties:
  email:
    type: string
    format: email
    description: Email address of the account to send the password reset link to.
    example: tutor@example.com
description: |-
  Forgot-password request body
  Always succeeds (200) regardless of whether the address is known, so the
  endpoint can't be used to enumerate accounts. When the address maps to a
  real password-provider account, a reset email is sent via SMTP.
