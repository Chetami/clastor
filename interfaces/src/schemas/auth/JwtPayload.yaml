type: object
required:
  - uid
  - email
  - role
  - iat
  - exp
properties:
  uid:
    type: string
    description: Firebase Auth UID
    example: abc123xyz456
  email:
    type: string
    format: email
    description: User's email address
    example: admin@example.com
  role:
    $ref: '../common/Role.yaml'
  currentOrgId:
    type: string
    nullable: true
    description: >-
      ID of the organisation the user is currently operating in, or null for
      personal mode. Mirrors users.currentOrgId; baked into the JWT on login
      and re-issued whenever the user switches organisation.
    example: org_abc123
  iat:
    type: integer
    description: Issued at timestamp (Unix epoch)
    example: 1718780400
  exp:
    type: integer
    description: Expiration timestamp (Unix epoch, 1 hour after iat)
    example: 1718784000
description: |-
  JWT Payload interface
  Represents the payload stored in the custom JWT token
