type: object
required:
  - data
  - nextCursor
  - hasMore
properties:
  data:
    type: array
    items:
      $ref: './LessonResponse.yaml'
    description: >-
      Lessons for the current page (paginated mode) or every matching lesson
      (unpaginated mode, when the request omitted `limit`).
  nextCursor:
    type: string
    nullable: true
    description: >-
      Opaque cursor for the next page. Pass it back as the `cursor` query
      parameter to fetch the next page. `null` when there are no more pages
      (or in unpaginated mode).
    example: eyJzIjoiMjAyNi0wNi0wM1Q...
  hasMore:
    type: boolean
    description: >-
      `true` when another page is available (equivalent to `nextCursor`
      being non-null).
    example: true
description: |-
  List response for lessons. Cursor-paginated when the request supplied a
  `limit`; otherwise the full matching set with `nextCursor` null.
