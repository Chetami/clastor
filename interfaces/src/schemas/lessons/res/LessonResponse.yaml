type: object
required:
  - id
  - studentId
  - startDateTime
  - durationMinutes
  - acceptanceStatus
  - attendanceStatus
  - remindersEnabled
  - isPaid
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    description: Unique lesson identifier
    example: lesson_a1b2c3d4e5f6
  studentId:
    type: string
    description: ID of the student this lesson is linked to
    example: student_123
  subject:
    type: string
    nullable: true
    description: Subject of the lesson
    example: Mathematics
  startDateTime:
    type: string
    format: date-time
    description: When the lesson starts (ISO 8601)
    example: "2026-06-20T09:00:00.000Z"
  durationMinutes:
    type: integer
    minimum: 1
    description: Lesson duration in minutes
    example: 60
  location:
    type: string
    nullable: true
    description: Where the lesson takes place (e.g. "Google Meet", "Room 5")
    example: Google Meet
  meetLink:
    type: string
    nullable: true
    description: >-
      Google Meet URL for Meet lessons (e.g. https://meet.google.com/xxx). Null
      for non-Meet lessons. Used to render "Join" buttons in the UI.
    example: https://meet.google.com/abc-mnop-xyz
  notes:
    type: string
    nullable: true
    description: Free-form tutor notes about the lesson
  todos:
    type: array
    description: Checklist items attached to this lesson.
    items:
      $ref: '../LessonTodo.yaml'
    default: []
  acceptanceStatus:
    $ref: '../LessonAcceptance.yaml'
  attendanceStatus:
    $ref: '../AttendanceStatus.yaml'
  seriesId:
    type: string
    nullable: true
    description: ID of the recurring series, or null for a one-off lesson
    example: series_a1b2c3d4e5f6
  isCancelled:
    type: boolean
    description: Forward-looking cancellation flag for this occurrence
    example: false
  isException:
    type: boolean
    description: True if individually edited (excluded from series bulk edits)
    example: false
  remindersEnabled:
    type: boolean
    description: Whether reminder notifications should be sent for this lesson
    example: true
  lastStudentNotifiedAt:
    type: string
    format: date-time
    nullable: true
    description: >-
      Timestamp of the most recent manual "Notify Student" email for this
      lesson, or null if never sent. Drives the resend cooldown in the UI.
    example: "2026-06-20T09:00:00.000Z"
  studentNotifiedCount:
    type: integer
    minimum: 0
    description: How many "Notify Student" emails have been sent for this lesson.
    example: 0
  isPaid:
    type: boolean
    description: Whether this lesson has been paid for
    example: false
  invoiceId:
    type: string
    nullable: true
    description: >-
      ID of the invoice this lesson is on, or null if not invoiced.
    example: inv_a1b2c3d4e5f6
  googleCalendarEventId:
    type: string
    nullable: true
    description: >-
      ID of the Google Calendar event synced for this lesson, or null if not
      yet synced (Google not connected or sync failed). Used by the UI to show
      sync status.
    example: abc123xyz_google_event
  googleCalendarSyncedAt:
    type: string
    format: date-time
    nullable: true
    description: >-
      Timestamp of the most recent successful Google Calendar sync, or null.
    example: "2026-06-20T09:00:00.000Z"
  createdAt:
    type: string
    format: date-time
    description: When the lesson record was created
  updatedAt:
    type: string
    format: date-time
    description: When the lesson record was last updated
  tutorId:
    type: string
    nullable: true
    description: >-
      UID of the owning tutor. Populated only on admin (system-wide) list
      responses; omitted/null for tutor callers (the owner is implied).
  tutorName:
    type: string
    nullable: true
    description: Display name of the owning tutor. Populated only on admin list responses.
  tutorEmail:
    type: string
    nullable: true
    description: Email of the owning tutor. Populated only on admin list responses.
description: |-
  Lesson response object
  Represents a lesson as returned by the API. tutorId is excluded for tutor
  callers (the owning tutor is implied) but populated on admin list responses.
