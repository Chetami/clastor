type: object
required:
  - id
  - tutorId
  - studentId
  - startDateTime
  - durationMinutes
  - acceptanceStatus
  - attendanceStatus
  - remindersEnabled
  - isPaid
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    description: Unique lesson identifier
    example: lesson_a1b2c3d4e5f6
  tutorId:
    type: string
    description: ID of the tutor who owns this lesson
    example: tutor_abc123
  studentId:
    type: string
    description: >-
      ID of the student this lesson is linked to. Single student today;
      to be expanded to multiple students in the future.
    example: student_123
  subject:
    type: string
    nullable: true
    description: Subject of the lesson
    example: Mathematics
  startDateTime:
    type: string
    format: date-time
    description: When the lesson starts (ISO 8601)
    example: "2026-06-20T09:00:00.000Z"
  durationMinutes:
    type: integer
    minimum: 1
    description: Lesson duration in minutes. End time is derived (start + duration).
    example: 60
  location:
    type: string
    nullable: true
    description: Where the lesson takes place
    example: Online — Zoom
  notes:
    type: string
    nullable: true
    description: Free-form tutor notes about the lesson
  todos:
    type: array
    description: Checklist items attached to this lesson.
    items:
      $ref: './LessonTodo.yaml'
    default: []
  acceptanceStatus:
    $ref: './LessonAcceptance.yaml'
  attendanceStatus:
    $ref: './AttendanceStatus.yaml'
  seriesId:
    type: string
    nullable: true
    description: >-
      ID of the recurring series this lesson belongs to, or null for a
      one-off lesson.
    example: series_a1b2c3d4e5f6
  isCancelled:
    type: boolean
    description: >-
      Forward-looking cancellation flag (e.g. a single occurrence or an
      entire future series cancelled ahead of time). Distinct from
      attendanceStatus which records what happened after the fact.
    example: false
  isException:
    type: boolean
    description: >-
      True once this occurrence has been individually edited, so later
      "edit all future" series operations skip it.
    example: false
  remindersEnabled:
    type: boolean
    description: >-
      Whether the student should receive reminder notifications for this
      lesson. The dispatch of reminders is handled separately.
    example: true
  lastStudentNotifiedAt:
    type: string
    format: date-time
    nullable: true
    description: >-
      Timestamp of the most recent manual "Notify Student" email sent for
      this lesson, or null if one has never been sent. Used to enforce a
      cooldown that prevents spamming the student.
    example: "2026-06-20T09:00:00.000Z"
  studentNotifiedCount:
    type: integer
    minimum: 0
    description: How many "Notify Student" emails have been sent for this lesson.
    example: 0
  isPaid:
    type: boolean
    description: >-
      Whether this lesson has been paid for. Defaults to false on creation;
      toggled true once payment is recorded.
    example: false
  invoiceId:
    type: string
    nullable: true
    description: >-
      ID of the invoice this lesson is currently associated with, or null
      if it is not on any invoice. Set when the lesson is added to an
      invoice; cleared when that invoice is voided or deleted. Prevents
      the same lesson from appearing on multiple invoices.
    example: inv_a1b2c3d4e5f6
  googleCalendarEventId:
    type: string
    nullable: true
    description: >-
      ID of the Google Calendar event created for this lesson on the tutor's
      primary calendar (two-way sync). Null when Google isn't connected, the
      lesson hasn't been pushed yet, or a previous push failed. Used to map
      app lessons to Google events for update/cancel sync.
    example: abc123xyz_google_event
  googleCalendarSyncedAt:
    type: string
    format: date-time
    nullable: true
    description: >-
      Timestamp of the most recent successful Google Calendar sync for this
      lesson, or null if it has never been synced.
    example: "2026-06-20T09:00:00.000Z"
  icsUid:
    type: string
    nullable: true
    description: >-
      Stable iCalendar UID (e.g. "lesson_abc@examify-tms") assigned the first
      time a calendar invite is sent for this lesson. Reusing the same UID
      across resends lets calendar clients treat them as updates
      (SEQUENCE bumps) to the same event rather than new duplicates.
      Null until the first notify-student send.
    example: lesson_a1b2c3d4e5f6@examify-tms
  rsvpTokenVersion:
    type: integer
    minimum: 0
    description: >-
      Monotonic version stamped into the RSVP link token. Bumped on each
      notify-student send so that resending invalidates the Accept/Decline
      links from all previous emails.
    example: 0
  createdAt:
    type: string
    format: date-time
    description: When the lesson record was created
  updatedAt:
    type: string
    format: date-time
    description: When the lesson record was last updated
description: |-
  Lesson interface
  Represents a lesson in the Firestore lessons collection.
  Lifecycle status (scheduled/cancelled/completed) is derived from
  attendanceStatus rather than stored separately.
