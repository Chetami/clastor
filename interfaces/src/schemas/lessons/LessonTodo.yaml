type: object
required:
  - id
  - text
  - done
properties:
  id:
    type: string
    description: Stable unique identifier for this todo item.
    example: todo_a1b2c3d4
  text:
    type: string
    description: The todo task description.
    example: Review chapter 5 exercises
  done:
    type: boolean
    description: Whether this todo item is checked off.
    example: false
description: |-
  A single checklist item attached to a lesson.
