type: object
properties:
  studentId:
    type: string
    nullable: true
    description: ID of the student to link this lesson to
  subject:
    type: string
    nullable: true
    description: Subject of the lesson
  startDateTime:
    type: string
    format: date-time
    nullable: true
    description: When the lesson starts (ISO 8601)
  durationMinutes:
    type: integer
    minimum: 1
    nullable: true
    description: Lesson duration in minutes
  location:
    type: string
    nullable: true
    description: Where the lesson takes place (e.g. "Google Meet", "Room 5")
  meetLink:
    type: string
    nullable: true
    description: >-
      Google Meet URL for Meet lessons. Set alongside location="Google Meet"
      when a Meet link is generated. Pass null to clear.
  notes:
    type: string
    nullable: true
    description: Free-form tutor notes about the lesson
  todos:
    type: array
    nullable: true
    description: Checklist items attached to this lesson (replaces the entire list).
    items:
      $ref: '../LessonTodo.yaml'
  acceptanceStatus:
    $ref: '../LessonAcceptance.yaml'
  remindersEnabled:
    type: boolean
    nullable: true
    description: Whether reminder notifications should be sent for this lesson
  isPaid:
    type: boolean
    nullable: true
    description: Whether this lesson has been paid for
description: |-
  Request body for updating a lesson
  All fields are optional. attendanceStatus is updated via the dedicated
  RecordAttendanceRequest endpoint.
