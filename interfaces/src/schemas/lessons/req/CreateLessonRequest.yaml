type: object
required:
  - studentId
  - startDateTime
  - durationMinutes
properties:
  studentId:
    type: string
    description: ID of the student to link this lesson to
    example: student_123
  subject:
    type: string
    nullable: true
    description: Subject of the lesson
    example: Mathematics
  startDateTime:
    type: string
    format: date-time
    description: When the lesson starts (ISO 8601)
    example: "2026-06-20T09:00:00.000Z"
  durationMinutes:
    type: integer
    minimum: 1
    description: Lesson duration in minutes
    example: 60
  location:
    type: string
    nullable: true
    description: Where the lesson takes place
    example: Online — Zoom
  notes:
    type: string
    nullable: true
    description: Free-form tutor notes about the lesson
  remindersEnabled:
    type: boolean
    default: true
    description: Whether reminder notifications should be sent for this lesson
    example: true
description: |-
  Request body for creating a new lesson
  acceptanceStatus defaults to "pending" and attendanceStatus to
  "unrecorded"; both are set server-side.
