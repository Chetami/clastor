type: object
required:
  - studentId
  - subject
  - durationMinutes
  - intervalWeeks
  - slots
  - timezone
  - startDate
properties:
  studentId:
    type: string
    description: ID of the student to link this series to
    example: student_123
  subject:
    type: string
    description: Subject of the lessons
    example: Mathematics
  durationMinutes:
    type: integer
    minimum: 1
    description: Duration in minutes of every occurrence
    example: 60
  location:
    type: string
    nullable: true
    description: Where the lessons take place
    example: Online — Zoom
  notes:
    type: string
    nullable: true
    description: Free-form tutor notes shared across occurrences
  intervalWeeks:
    type: integer
    minimum: 1
    description: Cadence in weeks (1 = weekly, 2 = biweekly)
    example: 1
  slots:
    type: array
    minItems: 1
    maxItems: 7
    items:
      $ref: '../LessonSlot.yaml'
    description: The weekly slots making up this arrangement
  timezone:
    type: string
    description: IANA timezone for the slot wall-clock times
    example: America/New_York
  startDate:
    type: string
    format: date
    description: Anchor date (YYYY-MM-DD); occurrences begin from this date
    example: "2026-06-23"
  until:
    type: string
    format: date
    nullable: true
    description: Inclusive end date. Exactly one of until/count required.
    example: "2026-08-29"
  count:
    type: integer
    minimum: 1
    nullable: true
    description: Total occurrences to generate. Exactly one of until/count required.
    example: 12
  remindersEnabled:
    type: boolean
    default: true
    description: Whether reminders should be sent for occurrences
    example: true
description: |-
  Request body for creating a recurring lesson series.
  acceptanceStatus defaults to "pending" (set server-side). Exactly one
  of `until` or `count` must be provided to bound the series.
