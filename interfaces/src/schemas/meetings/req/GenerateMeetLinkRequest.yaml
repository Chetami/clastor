type: object
properties:
  lessonId:
    type: string
    description: >-
      ID of the lesson the Meet link is for. When provided, the Meet
      conference is attached to the lesson's existing Google Calendar event
      (avoiding a duplicate calendar entry). If the lesson has no backing
      event yet, a new event is created and stored on the lesson.
    example: "lesson_abc123"
  startDateTime:
    type: string
    format: date-time
    description: >-
      When the lesson starts (ISO 8601). Used to time the backing Google
      Calendar event. If omitted, the event is created for the near term.
    example: "2026-06-20T09:00:00.000Z"
  durationMinutes:
    type: integer
    minimum: 1
    description: Lesson duration in minutes. Defaults to 30 when omitted.
    example: 60
description: |-
  Request body for generating a Google Meet link. All fields are optional;
  the link is created via a backing Google Calendar event.
