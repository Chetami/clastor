type: object
required:
  - tutorId
  - name
  - createdAt
  - studentCount
  - outstandingAmount
properties:
  tutorId:
    type: string
  name:
    type: string
  email:
    type: string
    nullable: true
  avatarUrl:
    type: string
    nullable: true
  createdAt:
    type: string
    format: date-time
  lastActive:
    type: string
    format: date-time
    nullable: true
  studentCount:
    type: integer
    minimum: 0
    description: Number of students belonging to this tutor.
  outstandingAmount:
    type: number
    format: double
    minimum: 0
    description: Total outstanding (open + overdue) invoice amount for this tutor.
description: |-
  A tutor row in the admin tutors list, with light per-tutor stats.
