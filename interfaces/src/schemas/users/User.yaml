type: object
required:
  - id
  - name
  - email
  - role
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    description: Firebase Auth UID
    example: abc123xyz456
  name:
    type: string
    description: User's full name
    example: John Doe
  email:
    type: string
    format: email
    description: User's email address
    example: user@example.com
  role:
    $ref: '../common/Role.yaml'
  avatarUrl:
    type: string
    nullable: true
    description: Optional profile picture URL
  currency:
    type: string
    description: ISO 4217 currency code the tutor charges in
    default: AUD
    example: AUD
  createdAt:
    type: string
    format: date-time
    description: Account creation timestamp
  updatedAt:
    type: string
    format: date-time
    description: Last profile update timestamp
  lastActive:
    type: string
    format: date-time
    nullable: true
    description: Last activity timestamp
  onboardingComplete:
    type: boolean
    default: false
    description: Whether the user has finished or dismissed the onboarding flow
  tourSeen:
    type: boolean
    default: false
    description: Whether the user has seen (or skipped) the in-app product tour
description: |-
  User interface
  Represents a user in the Firestore users collection
