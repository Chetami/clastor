type: object
required:
  - id
  - name
  - email
  - role
  - createdAt
  - updatedAt
properties:
  id:
    type: string
    description: Firebase Auth UID
    example: abc123xyz456
  name:
    type: string
    description: User's full name
    example: John Doe
  email:
    type: string
    format: email
    description: User's email address
    example: user@example.com
  role:
    $ref: '../common/Role.yaml'
  avatarUrl:
    type: string
    nullable: true
    description: Optional profile picture URL
  currency:
    type: string
    description: ISO 4217 currency code the tutor charges in
    default: AUD
    example: AUD
  timezone:
    type: string
    nullable: true
    description: >-
      IANA timezone identifier the tutor's wall-clock times are rendered in
      (e.g. Australia/Sydney). Detected from the browser and persisted so
      server-rendered emails and calendar invites show local times. Null for
      legacy docs created before this field existed (falls back to UTC).
    example: Australia/Sydney
  reminderLeadTime:
    $ref: '../common/ReminderLeadTime.yaml'
  workingHours:
    nullable: true
    allOf:
      - $ref: './WorkingHours.yaml'
    description: >-
      The tutor's weekly working hours (per-day start/end windows or null for
      a day off). Null overall means not configured. Drives the Schedule's
      shaded business-hours bands and the out-of-hours booking warning.
  subjects:
    type: array
    description: >-
      Subjects this tutor teaches (their catalogue). Single source of truth:
      students are tagged by subject id via their `subjectIds` field.
    items:
      $ref: '../common/Subject.yaml'
    default: []
  createdAt:
    type: string
    format: date-time
    description: Account creation timestamp
  updatedAt:
    type: string
    format: date-time
    description: Last profile update timestamp
  lastActive:
    type: string
    format: date-time
    nullable: true
    description: Last activity timestamp
  onboardingComplete:
    type: boolean
    default: false
    description: Whether the user has finished or dismissed the onboarding flow
  tourSeen:
    type: boolean
    default: false
    description: Whether the user has seen (or skipped) the in-app product tour
  invoiceSettings:
    allOf:
      - $ref: './InvoiceSettings.yaml'
    description: >-
      Invoice customisation preferences (ABN + bank details) printed on this
      tutor's invoices. Null means no extra details are shown.
  emailReviewSettings:
    allOf:
      - $ref: './EmailReviewSettings.yaml'
    description: >-
      Controls whether outbound emails are reviewed before sending. Null means
      review is enabled (the default).
description: |-
  User interface
  Represents a user in the Firestore users collection
