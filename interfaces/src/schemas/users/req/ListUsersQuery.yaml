type: object
properties:
  limit:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
    description: Maximum number of users to return
    example: 20
  offset:
    type: integer
    minimum: 0
    default: 0
    description: Number of users to skip (for pagination)
    example: 0
  role:
    $ref: '../../common/Role.yaml'
    description: Filter by user role
  search:
    type: string
    description: Search query to filter by name or email
    example: john
description: |-
  Query parameters for listing users
  All parameters are optional and used for filtering and pagination
