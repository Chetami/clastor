type: object
required:
  - name
  - email
  - role
properties:
  name:
    type: string
    description: User's full name
    example: John Doe
  email:
    type: string
    format: email
    description: User's email address
    example: user@example.com
  role:
    $ref: '../../common/Role.yaml'
    description: User's role in the system
  avatarUrl:
    type: string
    nullable: true
    description: Optional profile picture URL
description: |-
  Request body for creating a new user
  All required fields must be provided; id and timestamps are generated server-side
