type: object
properties:
  name:
    type: string
    description: User's full name
    example: John Doe
  email:
    type: string
    format: email
    description: User's email address
    example: user@example.com
  role:
    $ref: '../../common/Role.yaml'
    description: User's role in the system
  avatarUrl:
    type: string
    nullable: true
    description: Optional profile picture URL
  currency:
    type: string
    description: ISO 4217 currency code the tutor charges in (e.g. AUD, USD)
    example: AUD
  timezone:
    type: string
    nullable: true
    description: >-
      IANA timezone identifier the tutor is in (e.g. Australia/Sydney).
      Detected from the browser and pushed so server-rendered emails and
      calendar invites show the tutor's local time. Pass null to clear.
  reminderLeadTime:
    $ref: '../../common/ReminderLeadTime.yaml'
  workingHours:
    nullable: true
    allOf:
      - $ref: '../WorkingHours.yaml'
    description: >-
      The tutor's weekly working hours. Pass null to clear (no working hours
      configured). Each weekday is either a {start,end} window or null (day
      off).
  subjects:
    type: array
    description: >-
      Full replacement for the tutor's subject catalogue. Each entry needs a
      stable `id` (preserve existing ids when renaming so student tags stay
      intact) and a non-empty `name`; `color` is optional.
    items:
      $ref: '../../common/Subject.yaml'
  onboardingComplete:
    type: boolean
    description: Mark the user's onboarding as finished (or dismissed)
  tourSeen:
    type: boolean
    description: Mark the in-app product tour as seen (or skipped)
  invoiceSettings:
    allOf:
      - $ref: '../InvoiceSettings.yaml'
    description: >-
      Invoice customisation preferences (ABN + bank details). Pass null to
      clear all invoice details. Individual nested fields are nullable so a
      tutor can save partial details.
  emailReviewSettings:
    allOf:
      - $ref: '../EmailReviewSettings.yaml'
    description: >-
      Controls whether outbound emails are reviewed before sending. Pass
      `{ reviewEnabled: false }` to send all emails immediately in the
      background. Pass null to restore the default (review enabled).
description: |-
  Request body for updating a user
  All fields are optional; only provided fields will be updated
