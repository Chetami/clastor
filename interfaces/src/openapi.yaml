openapi: 3.0.3
info:
  title: Examify TMS API
  description: API for Examify Tutor Management System
  version: 1.0.0
  contact:
    name: Examify TMS Team

servers:
  - url: http://localhost:3001/api
    description: Local development server
  - url: https://api.examify-tms.com/api
    description: Production server

tags:
  - name: auth
    description: Authentication endpoints

paths:
  /auth/login:
    post:
      tags:
        - auth
      summary: Login with Firebase token
      description: |
        Authenticates a user by verifying their Firebase ID token and
        returning a custom JWT token for subsequent API calls.
      operationId: login
      security:
        - BearerAuth: []
      requestBody: null
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken:
                  summary: Invalid Firebase token
                  value:
                    message: Invalid Firebase token
                userNotFound:
                  summary: User not found in Firestore
                  value:
                    message: User not found

  /auth/verify:
    get:
      tags:
        - auth
      summary: Verify JWT token
      description: |
        Verifies a custom JWT token and returns the associated user information.
        Use this to check if a token is still valid and get the current user info.
      operationId: verifyToken
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Firebase ID token for /auth/login endpoint.
        Custom JWT token for /auth/verify and other protected endpoints.

  schemas:
    Role:
      type: string
      enum:
        - system_admin
        - tutor
      description: User role determining permissions

    UserInfo:
      type: object
      description: Basic user information returned by the API
      required:
        - uid
        - email
        - role
      properties:
        uid:
          type: string
          description: Firebase Auth UID
          example: abc123xyz456
        email:
          type: string
          format: email
          description: User's email address
          example: admin@example.com
        role:
          $ref: '#/components/schemas/Role'

    JWTPayload:
      type: object
      description: Full JWT payload including timestamps
      required:
        - uid
        - email
        - role
        - iat
        - exp
      properties:
        uid:
          type: string
          description: Firebase Auth UID
          example: abc123xyz456
        email:
          type: string
          format: email
          description: User's email address
          example: admin@example.com
        role:
          $ref: '#/components/schemas/Role'
        iat:
          type: integer
          description: Issued at timestamp (Unix epoch)
          example: 1718780400
        exp:
          type: integer
          description: Expiration timestamp (Unix epoch, 1 hour after iat)
          example: 1718784000

    LoginResponse:
      type: object
      description: Response from successful login
      required:
        - jwtToken
        - user
      properties:
        jwtToken:
          type: string
          description: Custom JWT token (expires in 1 hour)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/UserInfo'

    VerifyResponse:
      type: object
      description: Response from token verification
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/JWTPayload'

    Error:
      type: object
      description: Error response
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable error message
          example: Invalid Firebase token
        code:
          type: string
          description: Optional error code for programmatic handling
          example: AUTH_INVALID_TOKEN
